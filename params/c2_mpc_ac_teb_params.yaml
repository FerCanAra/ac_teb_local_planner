# AC-TEB controller (Nav2 controller_server). Same parameters as the
# original TEB plus the `aisle` block. With aisle.enabled: false the plugin
# behaves exactly like the original TEB.
controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "ac_teb_local_planner::AcTebLocalPlannerROS"
      odom_topic: /odom
      map_frame: /odom
      teb_autosize: 1.0
      transform_tolerance: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.2
      max_samples: 500
      global_plan_overwrite_orientation: False
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 1.5
      global_plan_viapoint_sep: 0.3
      global_plan_prune_distance: 1.0
      exact_arc_length: True
      feasibility_check_no_poses: 2
      publish_feedback: False
      # Robot
      max_vel_x: 0.5
      max_vel_x_backwards: 0.5
      max_vel_theta: 1.0         # paper: |w| <= 1.0 rad/s
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      footprint_model:
        type: "circular"
        radius: 0.4             # paper: r_robot
      # Obstacles
      free_goal_vel: True
      # NOTE: a narrow row (W ~ 1 m) with radius 0.36 m leaves ~0.14 m per side.
      # Any min_obstacle_dist > W/2 - radius makes the obstacle term and the
      # centering term compete (compatibility condition of AC-TEB).
      min_obstacle_dist: 0.10    # paper: d_obst <= W/2 - r_robot (compatibility)
      inflation_dist: 0.4
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 2.0
      obstacle_poses_affected: 20
      include_dynamic_obstacles: True
      dynamic_obstacle_inflation_dist: 0.6
      costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5
      # Optimization
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 6.0
      weight_max_vel_x: 0.5
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 0.5
      weight_acc_lim_theta: 10.5
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 50.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_viapoint: 5.0       # paper: gamma_vp
      weight_adapt_factor: 2.0
      # Homotopy Class Planner
      enable_homotopy_class_planning: True
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      viapoints_all_candidates: True
      delete_detours_backwards: True
      visualize_hc_graph: False

      # ---------------- AC-TEB: aisle centering ----------------
      aisle:
        enabled: True
        # Labeled cloud of the base ground segmentation. The plugin logs its
        # fields and a histogram of label values on the first message: set
        # label_field / ground_label / obstacle_label accordingly.
        # label_field: "" -> every point of cloud_topic is treated as obstacle
        # (e.g. when only the obstacle cloud is available).
        cloud_topic: "/segmentation/labeled_points"
        label_field: "label"
        ground_label: 3            # Intel PointLabel::GROUND
        obstacle_label: 5          # Intel PointLabel::OBSTACLE
        wall_min_height: 0.05      # wall points: z in base frame [m]
        wall_max_height: 1.5
        # Observed aisle section in front of the robot
        s_min: 0.2
        s_max: 3.2                 # camera range (3 m): rows ~1 m off-axis enter the FOV only beyond ~1.6 m
        slice_length: 0.2
        lateral_max: 1.5
        edge_quantile: 0.1         # inner wall edge = 10 % quantile of |lateral|
        min_slices: 3
        min_points_per_slice: 2    # 320x240 depth image: ~4x fewer points per slice than 640x480
        ground_edge_weight: 0.3    # ground/wall junction replaces a missing wall slice (0 disables)
        junction_max_gap: 0.5      # obstacle points up to this distance beyond the ground end confirm the junction [m]
        junction_min_points: 1     # 0: accept every ground end (also image borders); 2: stricter vs ghosts
        huber_delta: 0.05
        # Kalman filter [e_y, psi, W]
        proc_noise_e: 0.01         # the aisle is static in the planning frame
        proc_noise_psi: 0.01
        proc_noise_w: 0.02
        meas_floor_e: 0.02
        meas_floor_psi: 0.02
        meas_floor_w: 0.03
        gate_chi2: 16.0
        reinit_after: 4            # gated frames before re-initialising (new aisle)
        timeout: 4.0              # [s] fallback only: the estimate is held by DISTANCE (hold_distance)
        max_e_std: 0.15
        min_width: 0.3
        max_width: 3.0
        max_heading_error: 0.5     # [rad] centring fades out between this and +0.3 rad (turning)
        hold_distance: 3.0         # [m] estimate held without seeing the rows (fades from 1.5 m, dropped at 3 m)
        end_fade: 1.0              # [m] fade-out before the end of the row / where the global path leaves the aisle
        end_ground_gap: 1.0        # [m] ground seen this far beyond the last wall slice -> end of row ahead
        # gamma_c(W) = weight / (1 + exp(width_steepness * (W - width_ref)))
        weight: 35.0               # paper: gamma_c^max
        width_ref: 3.0             # paper: W_bar (simulated rows ~2 m free, headlands >= 3.5 m)
        width_steepness: 6.0       # paper: alpha_W
        horizon: 2.0               # L_c: centering applied up to this distance ahead [m]
        ramp_distance: 1.5         # weight ramps 0 -> gamma_c over the first metre of the band (smooth convergence)
        ref_time_constant: 1.0     # [s] low-pass of the centreline used by the MPC (0: raw estimate)
        heading_weight: 15.0       # gamma_psi: heading alignment with the aisle (damps the lateral term; 0: off)
        vel_scale_linear: 1.0      # max_vel_x in narrow rows = nominal * this (1: off)
        vel_scale_angular: 1.0     # max_vel_theta in narrow rows = nominal * this (1: off)
        project_goal: True         # local goal moved onto the centreline when active
        publish_markers: True      # ~/FollowPath/aisle_markers, ~/FollowPath/aisle_state
